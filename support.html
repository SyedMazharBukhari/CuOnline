<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Push</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 80px;
        }

        .card {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>GitHub Workflow example</h1>
    <p>Git Workflow: Working Directory, Staging Area, LocalRepo, RemoteRepo</p>

    <button onclick="showMessage()">
        Submit
    </button>
</div>

<script>
function showMessage() {
    alert("Congratulations! You have learned the Github workflow");
}
</script>

</body>
</html>
